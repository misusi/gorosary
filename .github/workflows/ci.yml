name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Validate the prayer content
        # This is the important gate: a prayer with malformed frontmatter, a
        # mismatched id, or no place in the navigation fails the build.
        run: npm run check:content

      - name: Build the content and shared packages
        run: npm run build:packages

      - name: Test the liturgical calendar
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build the website
        run: npm run build --workspace @gorosary/web
